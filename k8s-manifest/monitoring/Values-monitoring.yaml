prometheus:
  prometheusSpec:
    retention: 15d
    nodeselector:
      kubernetes.io/hostname: monitoring-node
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  nodeselector:
    kubernetes.io/hostname: monitoring-node
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  adminPassword: "StrongPassword123!"
  service:
    type: NodePort
    nodePort: 30090

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: monitoring-node
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
            

additionalPrometheusRules:
  custom-crashloop-rules:
    groups:
      - name: custom-kubernetes-apps
        rules:
          - alert: kubePodcrashLoopingFast
            expr: max_overtime(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}{5m}) >= 1
            for: 5m
            labels:
              severity: warning
            annotations:
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in crashLoopBackoff"
              

          - alert: kubePodOOMKilled
            expr: max_overtime(kube_pod_container_status_terminated_reason{reason="OOMKilled"}) >= 1
            for: 10s
            labels:
              severity: critical
            annotations:
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled"